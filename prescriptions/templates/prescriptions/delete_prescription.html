
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Prescription</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 60px 20px;
        }
        .box {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
        }
        button {
            background: #dc3545;
            color: white;
            padding: 12px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        a {
            margin-left: 12px;
            color: #2457a7;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Delete Prescription</h2>
        <p>Are you sure you want to delete the prescription for
            <strong>{{ prescription.patient_name }}</strong>?
        </p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit">Yes, Delete</button>
            <a href="{% url 'home' %}">Cancel</a>
        </form>
    </div>
</body>
</html>
